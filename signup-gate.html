<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MatConnect — Legal Agreements</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Segoe UI',Arial,sans-serif;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px;}
    .modal{background:#fff;border-radius:20px;width:100%;max-width:640px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,0.4);display:flex;flex-direction:column;max-height:92vh;}
    .modal-header{background:linear-gradient(135deg,#0a193c 0%,#162a5e 100%);padding:24px 32px 20px;flex-shrink:0;}
    .logo{font-size:22px;font-weight:900;color:#fff;letter-spacing:1px;margin-bottom:6px;}
    .logo span{color:#f0b429;}
    .modal-header h2{font-size:19px;font-weight:800;color:#fff;margin-bottom:3px;}
    .modal-header p{font-size:13px;color:#8898bb;}
    .step-bar{display:flex;align-items:center;gap:6px;padding:14px 32px;background:#f7f9fc;border-bottom:1px solid #e8edf5;flex-shrink:0;}
    .dot{width:10px;height:10px;border-radius:50%;background:#e8edf5;transition:all 0.3s;}
    .dot.active{background:#f0b429;transform:scale(1.3);}
    .dot.done{background:#27ae60;}
    .step-label{font-size:12px;color:#5a6a8a;margin-left:6px;font-weight:600;}
    .step-label b{color:#0a193c;}
    .doc-wrap{flex:1;overflow-y:auto;padding:22px 32px 0;}
    .doc-title{font-size:17px;font-weight:800;color:#0a193c;margin-bottom:2px;}
    .doc-version{font-size:11px;color:#8898bb;margin-bottom:14px;}
    .doc-scroll{font-size:12.5px;color:#3a4a6a;line-height:1.7;background:#f7f9fc;border:1px solid #e8edf5;border-radius:12px;padding:18px;max-height:260px;overflow-y:auto;}
    .doc-scroll h3{font-size:12.5px;color:#0a193c;margin:12px 0 4px;font-weight:700;}
    .doc-scroll p{margin-bottom:7px;}
    .doc-scroll ul{padding-left:16px;margin-bottom:7px;}
    .doc-scroll li{margin-bottom:3px;}
    .doc-scroll strong{color:#0a193c;}
    .agree-section{padding:18px 32px 22px;border-top:1px solid #e8edf5;background:#fff;flex-shrink:0;}
    .check-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px;cursor:pointer;}
    .check-row input[type=checkbox]{width:19px;height:19px;accent-color:#f0b429;cursor:pointer;flex-shrink:0;margin-top:2px;}
    .check-row label{font-size:13.5px;color:#3a4a6a;line-height:1.5;cursor:pointer;}
    .check-row label b{color:#0a193c;}
    .btn-row{display:flex;gap:10px;}
    .btn-next{flex:1;background:#f0b429;color:#0a193c;border:none;padding:13px;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer;transition:all 0.2s;opacity:0.45;pointer-events:none;}
    .btn-next.on{opacity:1;pointer-events:all;}
    .btn-next.on:hover{background:#d4991f;}
    .btn-back{background:transparent;color:#5a6a8a;border:2px solid #e8edf5;padding:13px 18px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;transition:all 0.2s;display:none;}
    .btn-back:hover{border-color:#0a193c;color:#0a193c;}
    .ts-note{font-size:11px;color:#8898bb;text-align:center;margin-top:8px;min-height:16px;}
    .success{display:none;flex-direction:column;align-items:center;justify-content:center;padding:56px 32px;text-align:center;}
    .success-icon{font-size:60px;margin-bottom:16px;}
    .success h2{font-size:24px;font-weight:900;color:#0a193c;margin-bottom:8px;}
    .success p{font-size:14px;color:#5a6a8a;line-height:1.6;max-width:380px;margin-bottom:24px;}
    .btn-enter{background:#0a193c;color:#f0b429;border:none;padding:15px 40px;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;transition:all 0.2s;}
    .btn-enter:hover{background:#162a5e;}
    .coach-badge{display:inline-block;background:rgba(240,180,41,0.12);border:1px solid #f0b429;color:#c08000;padding:3px 12px;border-radius:20px;font-size:11px;font-weight:700;margin-bottom:12px;letter-spacing:0.5px;}
    @media(max-width:500px){.modal-header,.doc-wrap,.agree-section{padding-left:18px;padding-right:18px;}.step-bar{padding-left:18px;padding-right:18px;}}
  </style>
</head>
<body>
<div class="modal" id="modal">
  <div class="modal-header">
    <div class="logo">Mat<span>Connect</span></div>
    <h2 id="headerTitle">Before You Get Started</h2>
    <p id="headerSub">Please review and agree to our legal documents to continue.</p>
  </div>

  <div class="step-bar" id="stepBar">
    <div class="dot active" id="d0"></div>
    <div class="dot" id="d1"></div>
    <div class="dot" id="d2"></div>
    <div class="step-label">Step <b id="snum">1</b> of <b id="stotal">3</b></div>
  </div>

  <!-- STEPS rendered here -->
  <div class="doc-wrap" id="docWrap">
    <!-- Injected by JS -->
  </div>

  <div class="agree-section" id="agreeSection">
    <div class="check-row">
      <input type="checkbox" id="mainCheck" onchange="onCheck()"/>
      <label for="mainCheck" id="checkLabel">I have read and agree.</label>
    </div>
    <div class="btn-row">
      <button class="btn-back" id="btnBack" onclick="goBack()">← Back</button>
      <button class="btn-next" id="btnNext" onclick="nextStep()">I Agree — Continue →</button>
    </div>
    <div class="ts-note" id="tsNote"></div>
  </div>

  <div class="success" id="successScreen">
    <div class="success-icon">✅</div>
    <h2 id="successTitle">You're All Set!</h2>
    <p id="successMsg">Your agreements have been recorded with a secure timestamp. You're now ready to use MatConnect.</p>
    <button class="btn-enter" id="btnEnter" onclick="enterApp()">Enter MatConnect →</button>
    <div class="ts-note" style="margin-top:14px;" id="finalTs"></div>
  </div>
</div>

<script>
// ─── CONFIG ────────────────────────────────────────────────────────────────
// Detect mode from URL param: ?mode=coach  →  coach gate
// Default: signup gate (3 docs)
const urlParams = new URLSearchParams(window.location.search);
const mode = urlParams.get('mode') || 'signup'; // 'signup' | 'coach' | 'parent'

const SIGNUP_DOCS = [
  {
    id: 'Terms of Service',
    title: 'Terms of Service',
    version: 'Version 1.0 — Last updated May 19, 2026',
    checkLabel: 'I have read and agree to the <b>Terms of Service</b>, including the limitation of liability and arbitration clauses.',
    body: `
      <h3>1. Acceptance of Terms</h3>
      <p>By accessing or using the MatConnect platform, you agree to be bound by these Terms of Service. MatConnect is owned and operated by MatConnect LLC, Princeton, MN. If you do not agree, do not use the Platform.</p>
      <h3>2. Description of Service</h3>
      <p>MatConnect is an online marketplace that connects wrestling coaches with parents, guardians, and athletes for private training sessions. MatConnect acts solely as a technology platform and marketplace intermediary. All coaching services are provided independently by the Coach.</p>
      <h3>3. Eligibility</h3>
      <p>You must be at least 18 years of age or have parental/guardian consent. You must provide accurate registration information and have legal authority to agree to these Terms.</p>
      <h3>4. Booking and Payments</h3>
      <p>Coaches set their own rates. Cancellations 48+ hours before a session receive a full refund. Cancellations 24–48 hours prior receive a 50% refund. Cancellations under 24 hours receive no refund. Coach cancellations always result in a full refund to the client.</p>
      <h3>5. Limitation of Liability</h3>
      <p>TO THE MAXIMUM EXTENT PERMITTED BY LAW, MATCONNECT LLC SHALL NOT BE LIABLE FOR ANY INDIRECT, INCIDENTAL, SPECIAL, OR CONSEQUENTIAL DAMAGES, INCLUDING PHYSICAL INJURY OR DEATH RESULTING FROM TRAINING SESSIONS. MATCONNECT'S TOTAL LIABILITY SHALL NOT EXCEED THE AMOUNT YOU PAID IN THE PRECEDING 12 MONTHS.</p>
      <h3>6. Governing Law</h3>
      <p>These Terms shall be governed by the laws of the State of Minnesota. Disputes shall be resolved through binding arbitration in Princeton, Minnesota under AAA rules.</p>
      <h3>7. Contact</h3>
      <p>MatConnect LLC — matconnect777@gmail.com — Princeton, MN</p>
    `
  },
  {
    id: 'Privacy Policy',
    title: 'Privacy Policy',
    version: 'Version 1.0 — Last updated May 19, 2026',
    checkLabel: 'I have read and agree to the <b>Privacy Policy</b> and understand how my data is collected and used.',
    body: `
      <h3>1. Information We Collect</h3>
      <p>We collect account information (name, email, phone, photo), profile information, Platform communications, and reviews. We also automatically collect usage data, device information, and IP addresses.</p>
      <h3>2. How We Use Your Information</h3>
      <p>We use your information to create and manage your account, facilitate bookings, process payments, send service communications, improve the Platform, detect fraud, and comply with legal obligations.</p>
      <h3>3. How We Share Your Information</h3>
      <p>We do <strong>NOT</strong> sell your personal information. Coach profiles are visible to Clients. We share data only with trusted service providers (payment, hosting, analytics) under strict confidentiality agreements.</p>
      <h3>4. Children's Privacy (COPPA)</h3>
      <p>MatConnect is designed for adults acting on behalf of minor athletes. We do not knowingly collect personal information from children under 13 without parental consent.</p>
      <h3>5. Your Rights</h3>
      <p>You may request access, correction, deletion, or portability of your data at any time by contacting matconnect777@gmail.com.</p>
      <h3>6. Security</h3>
      <p>We implement SSL/TLS encryption, encrypted storage, and access controls to protect your data.</p>
      <h3>7. Contact</h3>
      <p>MatConnect LLC — matconnect777@gmail.com — Princeton, MN</p>
    `
  },
  {
    id: 'Code of Conduct',
    title: 'Community Code of Conduct',
    version: 'Version 1.0 — Last updated May 19, 2026',
    checkLabel: 'I have read and agree to the <b>Community Code of Conduct</b> and will uphold these standards as a MatConnect user.',
    body: `
      <h3>For All Users</h3>
      <p><strong>Respect:</strong> Treat every person with dignity regardless of age, race, gender, religion, or background. Communicate professionally through the Platform.</p>
      <p><strong>Honesty:</strong> Provide truthful information. Do not misrepresent your identity, credentials, or intentions. Do not fabricate reviews.</p>
      <p><strong>Safety:</strong> Report unsafe conduct or violations immediately to matconnect777@gmail.com.</p>
      <h3>For Coaches</h3>
      <ul>
        <li>Maintain appropriate professional boundaries with all athletes at all times</li>
        <li>Never conduct one-on-one sessions with a minor in a private, unobserved setting without parental authorization</li>
        <li>Complete SafeSport or equivalent youth protection training</li>
        <li>Arrive on time, prepared, and sober to every session</li>
        <li>Do not use abusive or inappropriate language with athletes</li>
      </ul>
      <h3>For Parents and Guardians</h3>
      <ul>
        <li>Be present during sessions, especially for younger athletes</li>
        <li>Communicate athlete limitations to the Coach before sessions begin</li>
        <li>Direct complaints to the Coach calmly or through the Platform — do not harass</li>
      </ul>
      <h3>Violations</h3>
      <p>Violations may result in a warning, account suspension, permanent ban, or referral to law enforcement. Reports involving potential child abuse will be referred to the appropriate authorities immediately.</p>
    `
  }
];

const COACH_DOCS = [
  {
    id: 'Independent Contractor Agreement',
    title: 'Coach Independent Contractor Agreement',
    version: 'Version 1.0 — Last updated May 19, 2026',
    checkLabel: 'I have read and agree to the <b>Independent Contractor Agreement</b>. I understand I am an independent contractor, not an employee of MatConnect.',
    body: `
      <h3>1. Independent Contractor Status</h3>
      <p>You are an <strong>independent contractor</strong> and not an employee, agent, or partner of MatConnect LLC. You are not entitled to employee benefits, workers' compensation, unemployment insurance, or paid leave from MatConnect.</p>
      <h3>2. Services</h3>
      <p>MatConnect grants you a non-exclusive license to use the Platform to list services, manage scheduling, communicate with Clients, and receive bookings. You retain full control over how coaching services are performed.</p>
      <h3>3. Compensation and Taxes</h3>
      <p>You set your own rates. MatConnect may charge a platform fee or commission disclosed at account setup. You are solely responsible for all federal, state, and local taxes. MatConnect will issue a 1099-NEC for earnings of $600+ per calendar year.</p>
      <h3>4. Coach Representations</h3>
      <ul>
        <li>All profile information is accurate and truthful</li>
        <li>You hold any licenses or certifications you claim to hold</li>
        <li>You have not been convicted of any crime involving violence, sexual misconduct, or child abuse</li>
        <li>You will immediately notify MatConnect if charged with or convicted of any such crime</li>
        <li>You are legally authorized to work in the United States</li>
      </ul>
      <h3>5. Prohibited Activities</h3>
      <ul>
        <li>Engaging in abusive, threatening, or harassing behavior toward Clients or athletes</li>
        <li>Any sexual misconduct or inappropriate contact with any athlete or minor</li>
        <li>Soliciting Clients outside the Platform to circumvent fees</li>
        <li>Accepting direct payment for Platform-booked sessions</li>
        <li>Misrepresenting qualifications or experience</li>
      </ul>
      <h3>6. Safety and Mandatory Reporting</h3>
      <p>You are responsible for conducting all sessions in a safe environment. You acknowledge you may be a mandatory reporter of child abuse under applicable Minnesota law and agree to comply with all reporting obligations.</p>
      <h3>7. Termination</h3>
      <p>MatConnect may terminate your access immediately for violations of this Agreement, receipt of credible misconduct reports, or any conduct posing a risk to users. Outstanding payments will be processed per the normal schedule.</p>
      <h3>8. Indemnification</h3>
      <p>You agree to indemnify MatConnect LLC from any claims arising from your coaching services, violation of this Agreement, or injury to an athlete during a session.</p>
      <h3>9. Governing Law</h3>
      <p>This Agreement is governed by Minnesota law. Disputes are resolved through binding arbitration in Princeton, MN under AAA rules.</p>
      <h3>10. Contact</h3>
      <p>MatConnect LLC — matconnect777@gmail.com — Princeton, MN</p>
    `
  }
];

const PARENT_DOCS = [
  {
    id: 'Liability Waiver',
    title: 'Liability Waiver & Release of Risk',
    version: 'Version 1.0 — Last updated May 19, 2026',
    checkLabel: 'I have read and agree to the <b>Liability Waiver and Release</b>. I understand wrestling carries inherent physical risks and I voluntarily accept these risks on behalf of the Athlete.',
    body: `
      <p>⚠️ <strong>PLEASE READ CAREFULLY — THIS IS A LEGAL DOCUMENT THAT AFFECTS YOUR RIGHTS.</strong></p>
      <h3>Acknowledgment of Risk</h3>
      <p>I understand and acknowledge that wrestling and related physical training activities involve <strong>inherent risks of physical injury</strong>, including but not limited to:</p>
      <ul>
        <li>Sprains, strains, and muscle tears</li>
        <li>Fractures and broken bones</li>
        <li>Joint injuries including dislocations</li>
        <li>Concussions and traumatic brain injuries</li>
        <li>Neck, back, and spinal injuries</li>
        <li>In rare cases, permanent disability or death</li>
      </ul>
      <p>These risks exist regardless of the skill level of the Coach or the care taken during training. <strong>I voluntarily accept these risks on behalf of the Athlete.</strong></p>
      <h3>Release of Liability</h3>
      <p>I hereby <strong>release, waive, discharge, and covenant not to sue</strong> MatConnect LLC, its officers, directors, employees, agents, and Coaches from any and all claims, damages, losses, and expenses arising out of or related to the Athlete's participation in any training session arranged through MatConnect.</p>
      <h3>Independent Contractor Acknowledgment</h3>
      <p>I understand that Coaches on MatConnect are independent contractors, not employees of MatConnect. MatConnect does not supervise or guarantee the quality or safety of any coaching session.</p>
      <h3>Medical Authorization</h3>
      <p>I authorize Coaches and emergency personnel to seek emergency medical treatment for the Athlete if I cannot be reached. I confirm the Athlete is in good physical health and I will disclose any known medical conditions or limitations to the Coach before the first session.</p>
      <h3>Indemnification</h3>
      <p>I agree to indemnify and hold harmless MatConnect LLC and all Released Parties from any claims brought by or on behalf of the Athlete arising from participation in any training session arranged through MatConnect.</p>
    `
  },
  {
    id: 'Cancellation and Refund Policy',
    title: 'Cancellation & Refund Policy',
    version: 'Version 1.0 — Last updated May 19, 2026',
    checkLabel: 'I have read and understand the <b>Cancellation & Refund Policy</b> and agree to its terms.',
    body: `
      <h3>Client Cancellations</h3>
      <ul>
        <li><strong>48+ hours before session:</strong> Full refund</li>
        <li><strong>24–48 hours before session:</strong> 50% refund</li>
        <li><strong>Less than 24 hours before session:</strong> No refund</li>
      </ul>
      <h3>Coach Cancellations</h3>
      <p>If a Coach cancels a session, the Client receives a <strong>full refund</strong> regardless of timing.</p>
      <h3>No-Shows</h3>
      <p>If the Client fails to appear for a session without cancelling, no refund will be issued. If the Coach fails to appear, the Client receives a full refund.</p>
      <h3>Refund Process</h3>
      <p>Refund requests must be submitted through the Platform within <strong>7 days</strong> of the session date. Approved refunds are processed within 5–10 business days to the original payment method.</p>
      <h3>Disputes</h3>
      <p>Payment disputes must be initiated through the Platform. MatConnect reserves the right to make final decisions on disputed transactions, and such decisions are binding.</p>
      <h3>Subscription Cancellations</h3>
      <p>Subscriptions may be cancelled at any time. Cancellations take effect at the end of the current billing period. No partial refunds are issued for unused subscription time.</p>
      <h3>Contact</h3>
      <p>MatConnect LLC — matconnect777@gmail.com — Princeton, MN</p>
    `
  }
];

// ─── INIT ────────────────────────────────────────────────────────────────────
let docs = [];
let step = 0;

if (mode === 'coach') {
  docs = COACH_DOCS;
  document.getElementById('headerTitle').textContent = 'Coach Agreement Required';
  document.getElementById('headerSub').textContent = 'Before going live, please sign the Coach Independent Contractor Agreement.';
} else if (mode === 'parent') {
  docs = PARENT_DOCS;
  document.getElementById('headerTitle').textContent = 'One More Step';
  document.getElementById('headerSub').textContent = 'Before your first booking, please review and sign the following documents.';
} else {
  docs = SIGNUP_DOCS;
}

// Set step indicator dots
const stepBar = document.getElementById('stepBar');
stepBar.innerHTML = '';
docs.forEach((_, i) => {
  const d = document.createElement('div');
  d.className = 'dot' + (i === 0 ? ' active' : '');
  d.id = 'd' + i;
  stepBar.appendChild(d);
});
const lbl = document.createElement('div');
lbl.className = 'step-label';
lbl.innerHTML = 'Step <b id="snum">1</b> of <b>' + docs.length + '</b>';
stepBar.appendChild(lbl);

renderStep();

function renderStep() {
  const doc = docs[step];
  const wrap = document.getElementById('docWrap');

  // Coach badge
  const badge = (mode === 'coach') ? '<div class="coach-badge">⚡ COACH ONLY</div>' : '';

  wrap.innerHTML = `
    ${badge}
    <div class="doc-title">${doc.title}</div>
    <div class="doc-version">${doc.version}</div>
    <div class="doc-scroll">${doc.body}</div>
    <div style="height:16px;"></div>
  `;

  document.getElementById('checkLabel').innerHTML = doc.checkLabel;
  document.getElementById('mainCheck').checked = false;
  document.getElementById('btnNext').classList.remove('on');

  const isLast = step === docs.length - 1;
  document.getElementById('btnNext').textContent = isLast ? 'I Agree — Finish ✓' : 'I Agree — Continue →';
  document.getElementById('btnBack').style.display = step > 0 ? 'block' : 'none';

  // Update dots
  docs.forEach((_, i) => {
    const d = document.getElementById('d' + i);
    if (!d) return;
    d.className = 'dot' + (i < step ? ' done' : i === step ? ' active' : '');
  });
  const snum = document.getElementById('snum');
  if (snum) snum.textContent = step + 1;
}

function onCheck() {
  const checked = document.getElementById('mainCheck').checked;
  document.getElementById('btnNext').className = 'btn-next' + (checked ? ' on' : '');
}

function nextStep() {
  if (!document.getElementById('mainCheck').checked) return;
  const doc = docs[step];
  const now = new Date();
  document.getElementById('tsNote').textContent = `✓ ${doc.title} signed at ${now.toLocaleTimeString()} on ${now.toLocaleDateString()}`;
  saveSignature(doc.id);
  step++;
  if (step >= docs.length) {
    showSuccess(now);
  } else {
    renderStep();
  }
}

function goBack() {
  if (step === 0) return;
  step--;
  renderStep();
  document.getElementById('tsNote').textContent = '';
}

function showSuccess(lastSigned) {
  document.getElementById('docWrap').style.display = 'none';
  document.getElementById('agreeSection').style.display = 'none';
  document.getElementById('stepBar').style.display = 'none';
  document.getElementById('successScreen').style.display = 'flex';
  document.getElementById('finalTs').textContent =
    `All ${docs.length} document${docs.length > 1 ? 's' : ''} signed and recorded on ${lastSigned.toLocaleDateString()} at ${lastSigned.toLocaleTimeString()}`;

  if (mode === 'coach') {
    document.getElementById('successTitle').textContent = "Agreement Signed!";
    document.getElementById('successMsg').textContent = "Your Coach Independent Contractor Agreement has been recorded. Your profile is now ready to go live on MatConnect.";
    document.getElementById('btnEnter').textContent = 'Go to My Coach Profile →';
  } else if (mode === 'parent') {
    document.getElementById('successTitle').textContent = "Ready to Book!";
    document.getElementById('successMsg').textContent = "Your documents have been signed and recorded. You can now book wrestling coaching sessions for your athlete.";
    document.getElementById('btnEnter').textContent = 'Find a Coach →';
  }
}

async function saveSignature(docType) {
  try {
    const userId = localStorage.getItem('matconnect_user_id') || sessionStorage.getItem('matconnect_user_id') || 'anonymous';
    const userEmail = localStorage.getItem('matconnect_user_email') || sessionStorage.getItem('matconnect_user_email') || '';
    const userName = localStorage.getItem('matconnect_user_name') || sessionStorage.getItem('matconnect_user_name') || '';
    const userRole = localStorage.getItem('matconnect_user_role') || sessionStorage.getItem('matconnect_user_role') || mode;

    await fetch('https://api.base44.com/api/apps/6a0ca39847493f85c562bff2/functions/signDocument', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_id: userId, user_email: userEmail, user_name: userName, document_type: docType, user_role: userRole, signature_text: `I agree to the ${docType}` })
    });
  } catch (e) { console.error('Signature error:', e); }
}

function enterApp() {
  // Post message to parent app if in iframe, otherwise redirect
  if (window.parent !== window) {
    window.parent.postMessage({ type: 'matconnect_agreements_complete', mode }, '*');
  } else {
    window.location.href = 'https://app.base44.com/apps/69a1a2c44d4d802c1ea0d1e3';
  }
}
</script>
</body>
</html>
